[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tg2max"
version = "0.2.0"
description = "Copy Telegram channel posts to a MAX channel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "telethon>=1.36",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "msgpack>=1.0",
    "websockets>=14.0",
    "aiohttp>=3.9",
    "qrcode>=7.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tg2max = "tg2max.main:main"

[tool.setuptools]
packages = ["tg2max"]

[tool.setuptools.package-data]
tg2max = ["rootca_ssl_rsa2022.crt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
